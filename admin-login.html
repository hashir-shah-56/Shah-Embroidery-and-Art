<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Login | Shah Embroidery &amp; Art</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-login-page">
  <main class="admin-panel admin-login-card">
    <p class="admin-eyebrow">Shah Embroidery &amp; Art</p>
    <h1>Admin Login</h1>
    <p class="admin-muted">Sign in to manage your products.</p>
    <form id="adminLoginForm">
      <div class="form-group"><label class="form-label" for="adminEmail">Email</label><input class="form-input" id="adminEmail" type="email" autocomplete="username" required></div>
      <div class="form-group"><label class="form-label" for="adminPassword">Password</label><input class="form-input" id="adminPassword" type="password" autocomplete="current-password" required></div>
      <p id="loginError" class="form-error-text" role="alert"></p>
      <button class="btn btn-primary" id="loginSubmit" type="submit">Log In</button>
    </form>
    <noscript>JavaScript is required to sign in.</noscript>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/admin-config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
